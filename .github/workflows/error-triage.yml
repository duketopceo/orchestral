name: error-triage

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: error-triage
  cancel-in-progress: false

jobs:
  file-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ensure glitchtip label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create glitchtip --force -c 0e8a16 -d "Auto-filed from observatory error tracking"
      - name: file new GlitchTip issues
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_ISSUES: "10"
        run: python3 scripts/glitchtip_to_issues.py
