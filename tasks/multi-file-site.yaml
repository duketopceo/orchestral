id: multi-file-site
type: multi-file
prompt: |
  Build a small static site for a coffee subscription service: a landing page
  and the stylesheet it depends on. The page needs a hero, a pricing section,
  and a signup form; the stylesheet must style those sections and stay small
  enough to read in one pass.
validation:
  - non_empty
  - zip_signature
  - has_paths
  # has_paths grades names and byte counts, so one byte per name passes. This
  # reads the bodies, so the artifact has to be the site the prompt describes.
  - has_content
assets: []
metadata:
  difficulty: medium
  estimated_subtasks: 2
  expected_paths:
    - index.html
    - style.css
  # Every token is a section the prompt names, so an artifact that carries them
  # has answered the prompt rather than named two files after it.
  required_content:
    index.html:
      - hero
      - pricing
      - email
    style.css:
      - pricing
      - form
