name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .[dev,tui]

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Task-spec audit
        # Fails the build when a spec requests a check the runner cannot run.
        # Warnings are reported but do not gate: they mark known gaming surface.
        run: python harness.py audit --strict

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy orchestral harness.py
