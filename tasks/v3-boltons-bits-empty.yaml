id: v3-boltons-bits-empty
title: 'boltons: empty Bits round-trip'
blurb: Repair a real mathutils defect — empty Bits break conversions and cannot round-trip — graded by pytest in a sandboxed checkout.
type: code
prompt: 'You are contributing to `boltons` (a library of Python stdlib

  extensions). A user filed this issue:


  > `boltons.mathutils.Bits` mishandles empty values. `Bits('''')`,

  > `Bits([])`, a zero-length slice like `Bits(''101'')[:0]`, and `Bits(0, 0)`

  > all produce a zero-length Bits, but the conversions break: `as_bin()` and

  > `as_hex()` emit garbage or crash, and `from_hex('''')` refuses the empty

  > form, so an empty Bits cannot round-trip.

  >

  > Expected: for any empty Bits `b`, `b.as_bin() == ''''`, `b.as_hex() == ''''`,

  > `b.as_list() == []`, `b.as_bytes() == b''''`, and

  > `Bits.from_bin(b.as_bin()) == Bits.from_hex(b.as_hex()) ==

  > Bits.from_bytes(b.as_bytes()) == b`. `from_hex` must still raise

  > `AttributeError` for `None`, `0`, and `False`. Non-empty behavior is

  > unchanged.


  Fix `boltons/mathutils.py` and return the complete modified file as

  `{"files": [{"path": "boltons/mathutils.py", "content": "..."}]}`.

  The harness overlays your files onto a full repo checkout and runs the

  project''s test suite.'
metadata:
  canary: "orc-canary-87fa4ecce08c3437"
  fixture: boltons-bits
  workdir: repo
  expected_paths:
  - boltons/mathutils.py
  setup_commands:
  - python -m pip install --quiet --no-index --find-links /home/user/wheelhouse pytest
  verify:
    command:
    - python
    - -m
    - pytest
    - tests/test_v3_bits.py
    - -x
    - -q
    fail_to_pass:
    - test_empty_bits_conversions
    - test_empty_bits_rejects_non_hex_inputs
  timeout_seconds: 240
  difficulty: hard
  archetype: bugfix
  contamination_risk: medium
  reference:
    boltons/mathutils.py: "# Copyright (c) 2013, Mahmoud Hashemi\n#\n# Redistribution and use in source and binary forms, with or without\n# modification, are permitted provided that the following conditions are\n# met:\n#\n#    * Redistributions of source code must retain the above copyright\n#      notice, this list of conditions and the following disclaimer.\n#\n#    * Redistributions in binary form must reproduce the above\n#      copyright notice, this list of conditions and the following\n#      disclaimer in the documentation and/or other materials provided\n#      with the distribution.\n#\n#    * The names of the contributors may not be used to endorse or\n#      promote products derived from this software without specific\n#      prior written permission.\n#\n# THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS\n# \"AS IS\" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT\n# LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR\n# A PARTICULAR\
      \ PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT\n# OWNER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL,\n# SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT\n# LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE,\n# DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY\n# THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT\n# (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE\n# OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.\n\n\"\"\"This module provides useful math functions on top of Python's\nbuilt-in :mod:`math` module.\n\"\"\"\n\nfrom math import ceil as _ceil, floor as _floor\nimport bisect\nimport binascii\n\n\ndef clamp(x, lower=float('-inf'), upper=float('inf')):\n    \"\"\"Limit a value to a given range.\n\n    Args:\n        x (int or float): Number to be clamped.\n        lower (int or float): Minimum value for x.\n        upper (int or float):\
      \ Maximum value for x.\n\n    The returned value is guaranteed to be between *lower* and\n    *upper*. Integers, floats, and other comparable types can be\n    mixed.\n\n    >>> clamp(1.0, 0, 5)\n    1.0\n    >>> clamp(-1.0, 0, 5)\n    0\n    >>> clamp(101.0, 0, 5)\n    5\n    >>> clamp(123, upper=5)\n    5\n\n    Similar to `numpy's clip`_ function.\n\n    .. _numpy's clip: http://docs.scipy.org/doc/numpy/reference/generated/numpy.clip.html\n\n    \"\"\"\n    if upper < lower:\n        raise ValueError('expected upper bound (%r) >= lower bound (%r)'\n                         % (upper, lower))\n    return min(max(x, lower), upper)\n\n\ndef ceil(x, options=None):\n    \"\"\"Return the ceiling of *x*. If *options* is set, return the smallest\n    integer or float from *options* that is greater than or equal to\n    *x*.\n\n    Args:\n        x (int or float): Number to be tested.\n        options (iterable): Optional iterable of arbitrary numbers\n          (ints or floats).\n\n    >>>\
      \ VALID_CABLE_CSA = [1.5, 2.5, 4, 6, 10, 25, 35, 50]\n    >>> ceil(3.5, options=VALID_CABLE_CSA)\n    4\n    >>> ceil(4, options=VALID_CABLE_CSA)\n    4\n    \"\"\"\n    if options is None:\n        return _ceil(x)\n    options = sorted(options)\n    i = bisect.bisect_left(options, x)\n    if i == len(options):\n        raise ValueError(\"no ceil options greater than or equal to: %r\" % x)\n    return options[i]\n\n\ndef floor(x, options=None):\n    \"\"\"Return the floor of *x*. If *options* is set, return the largest\n    integer or float from *options* that is less than or equal to\n    *x*.\n\n    Args:\n        x (int or float): Number to be tested.\n        options (iterable): Optional iterable of arbitrary numbers\n          (ints or floats).\n\n    >>> VALID_CABLE_CSA = [1.5, 2.5, 4, 6, 10, 25, 35, 50]\n    >>> floor(3.5, options=VALID_CABLE_CSA)\n    2.5\n    >>> floor(2.5, options=VALID_CABLE_CSA)\n    2.5\n\n    \"\"\"\n    if options is None:\n        return _floor(x)\n\
      \    options = sorted(options)\n\n    i = bisect.bisect_right(options, x)\n    if not i:\n        raise ValueError(\"no floor options less than or equal to: %r\" % x)\n    return options[i - 1]\n\n\nclass Bits:\n    '''\n    An immutable bit-string or bit-array object.\n    Provides list-like access to bits as bools,\n    as well as bitwise masking and shifting operators.\n    Bits also make it easy to convert between many\n    different useful representations:\n\n    * bytes -- good for serializing raw binary data\n    * int -- good for incrementing (e.g. to try all possible values)\n    * list of bools -- good for iterating over or treating as flags\n    * hex/bin string -- good for human readability\n\n    '''\n    __slots__ = ('val', 'len')\n\n    def __init__(self, val=0, len_=None):\n        if type(val) is not int:\n            if type(val) is list:\n                val = ''.join(['1' if e else '0' for e in val])\n            if type(val) is bytes:\n                val = val.decode('ascii')\n\
      \            if type(val) is str:\n                if len_ is None:\n                    len_ = len(val)\n                    if val.startswith('0x'):\n                        len_ = (len_ - 2) * 4\n                if val.startswith('0x'):\n                    val = int(val, 16)\n                else:\n                    if val:\n                        val = int(val, 2)\n                    else:\n                        val = 0\n            if type(val) is not int:\n                raise TypeError(f'initialized with bad type: {type(val).__name__}')\n        if val < 0:\n            raise ValueError('Bits cannot represent negative values')\n        if len_ is None:\n            len_ = len(f'{val:b}')\n        if val >= 2 ** len_:\n            raise ValueError(f'value {val} cannot be represented with {len_} bits')\n        self.val = val  # data is stored internally as integer\n        self.len = len_\n\n    def __getitem__(self, k):\n        if type(k) is slice:\n            return\
      \ Bits(self.as_bin()[k])\n        if type(k) is int:\n            if k < 0:\n                k += self.len\n            if k < 0 or k >= self.len:\n                raise IndexError(k)\n            return bool((1 << (self.len - k - 1)) & self.val)\n        raise TypeError(type(k))\n\n    def __len__(self):\n        return self.len\n\n    def __eq__(self, other):\n        if type(self) is not type(other):\n            return NotImplemented\n        return self.val == other.val and self.len == other.len\n\n    def __or__(self, other):\n        if type(self) is not type(other):\n            return NotImplemented\n        return Bits(self.val | other.val, max(self.len, other.len))\n\n    def __and__(self, other):\n        if type(self) is not type(other):\n            return NotImplemented\n        return Bits(self.val & other.val, max(self.len, other.len))\n\n    def __lshift__(self, other):\n        return Bits(self.val << other, self.len + other)\n\n    def __rshift__(self, other):\n\
      \        return Bits(self.val >> other, self.len - other)\n\n    def __hash__(self):\n        return hash(self.val)\n\n    def as_list(self):\n        return [c == '1' for c in self.as_bin()]\n\n    def as_bin(self):\n        if not self.len:\n            return ''\n        return f'{{0:0{self.len}b}}'.format(self.val)\n\n    def as_hex(self):\n        if not self.len:\n            return ''\n        # make template to pad out to number of bytes necessary to represent bits\n        tmpl = f'%0{2 * (self.len // 8 + ((self.len % 8) != 0))}X'\n        ret = tmpl % self.val\n        return ret\n\n    def as_int(self):\n        return self.val\n\n    def as_bytes(self):\n        return binascii.unhexlify(self.as_hex())\n\n    @classmethod\n    def from_list(cls, list_):\n        return cls(list_)\n\n    @classmethod\n    def from_bin(cls, bin):\n        return cls(bin)\n\n    @classmethod\n    def from_hex(cls, hex):\n        if isinstance(hex, bytes):\n            hex = hex.decode('ascii')\n\
      \        if hex == '':\n            return cls('')\n        if not hex.startswith('0x'):\n            hex = '0x' + hex\n        return cls(hex)\n\n    @classmethod\n    def from_int(cls, int_, len_=None):\n        return cls(int_, len_)\n\n    @classmethod\n    def from_bytes(cls, bytes_):\n        return cls.from_hex(binascii.hexlify(bytes_))\n\n    def __repr__(self):\n        cn = self.__class__.__name__\n        return f\"{cn}('{self.as_bin()}')\"\n"
  test_files:
    tests/test_v3_bits.py: "\"\"\"Verifier oracle for empty Bits — mirrors upstream fix commit\nefff866a3b (BSD-3-Clause, boltons). Staged after the worker fileset.\"\"\"\nfrom pytest import raises\n\nfrom boltons.mathutils import Bits\n\n\ndef test_empty_bits_conversions():\n    for bits in (Bits(''), Bits([]), Bits('101')[:0], Bits(0, 0)):\n        assert len(bits) == 0\n        assert bits.as_bin() == ''\n        assert bits.as_list() == []\n        assert bits.as_hex() == ''\n        assert bits.as_bytes() == b''\n        assert Bits.from_bin(bits.as_bin()) == bits\n        assert Bits.from_hex(bits.as_hex()) == bits\n        assert Bits.from_bytes(bits.as_bytes()) == bits\n\n\ndef test_empty_bits_rejects_non_hex_inputs():\n    for value in (None, 0, False):\n        with raises(AttributeError):\n            Bits.from_hex(value)\n"
