id: bugfix-lru-evict
title: "Fix a buggy LRU cache"
blurb: "A shipped lru.py has two real eviction bugs — find and fix both."
type: bugfix
prompt: |
  The module `lru.py` ships an LRU cache with two real bugs:

  1. `get` returns the value but does NOT mark the key as recently used —
     a `get` followed by an insert can evict a key that was just read.
  2. `put` on an existing key updates the value but leaves the key in its
     old recency position, so eviction order is wrong after updates.

  Fix both bugs in `lru.py`. Do not rewrite the API or add features.

  Return a JSON object {"files": [{"path": "lru.py", "content": "..."}]}
  with the complete corrected module.
metadata:
  module: lru.py
  expected_paths: [lru.py]
  timeout_seconds: 30
  max_code_lines: 80
  no_unsafe: true
  no_external_deps: true
  files:
    lru.py: |
      from collections import OrderedDict

      class LRUCache:
          def __init__(self, capacity: int):
              self.capacity = capacity
              self._data = OrderedDict()

          def get(self, key):
              if key not in self._data:
                  return None
              return self._data[key]  # BUG: no move_to_end — recency not updated

          def put(self, key, value):
              if key in self._data:
                  self._data[key] = value  # BUG: position not refreshed
                  return
              if len(self._data) >= self.capacity:
                  self._data.popitem(last=False)
              self._data[key] = value

          def __len__(self):
              return len(self._data)
  tests: |
    import unittest
    from lru import LRUCache

    class TestLRU(unittest.TestCase):
        def test_get_refreshes_recency(self):
            c = LRUCache(2)
            c.put("a", 1); c.put("b", 2)
            c.get("a")               # a is now most-recent
            c.put("c", 3)            # must evict b, not a
            self.assertIsNone(c.get("b"))
            self.assertEqual(c.get("a"), 1)

        def test_put_existing_refreshes_recency(self):
            c = LRUCache(2)
            c.put("a", 1); c.put("b", 2)
            c.put("a", 10)           # a is now most-recent
            c.put("c", 3)            # must evict b, not a
            self.assertIsNone(c.get("b"))
            self.assertEqual(c.get("a"), 10)

        def test_eviction_and_capacity(self):
            c = LRUCache(2)
            c.put("a", 1); c.put("b", 2); c.put("c", 3)
            self.assertIsNone(c.get("a"))
            self.assertEqual(len(c), 2)

        def test_missing_key(self):
            self.assertIsNone(LRUCache(1).get("nope"))
