name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11" with no upper bound, so the
        # whole range is a support claim. Pin exact minors: a floating "3.14" would
        # silently become 3.15 and reopen the gap this closes. Floor plus every
        # minor we have actually run the suite on.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev,tui]

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy orchestral harness.py
