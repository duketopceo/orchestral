id: sql-monthly-revenue
type: sql
prompt: >
  Write a single read-only SQL query (SQLite dialect) that answers: which
  product generated the most revenue each month? Return exactly one row per
  month that has an order line from a shipped order, with columns: month
  (YYYY-MM), product (name), revenue (total, rounded to 2 decimals), ordered by
  month ascending. Only count order_lines whose order status is 'shipped'. If
  two or more products tie for the highest revenue in a month, return the one
  whose product name sorts first alphabetically.
  The database has tables: products(id, name), orders(id, placed_on DATE,
  status), order_lines(order_id, product_id, qty, unit_price).
validation: []
assets: []
metadata:
  # v2: reference_sql compared a rounded revenue against an unrounded window
  # max, so any non-representable price made it return zero rows and turn the
  # task into a free pass. Same answer on the fixture below; see DUK-90.
  # v3: the prompt promised one row per month, but "WHERE revenue = best"
  # returned a row for every product tied at the month's maximum, so a correct
  # candidate that broke the tie was graded wrong. The prompt now states the
  # tie-break and ROW_NUMBER() picks exactly that winner; see DUK-117. Same
  # answer on the fixture below, which has no tie.
  # v4: "exactly one row per month" also over-promised for a month whose orders
  # were all cancelled or pending — the reference returns no row there, so a
  # candidate reading the clause literally was graded wrong for a row the prompt
  # should never have asked for. The prompt now scopes the clause to months
  # that have an order line from a shipped order. Same answer on the fixture
  # below, which has no such month; see DUK-123.
  #
  # v5: the coverage limit v4 recorded is closed. A run against the seed below
  # now grades both clauses the prompt states, so a wrong reference cannot pass
  # silently. The seed gained a fourth product, Iron, whose two January lines
  # are 3 x 29.68 + 1 x 0.96 = 89.99999999999999 in binary floating point:
  #   - that is not representable to the cent, so ROUND(..., 2) is load-bearing.
  #     Emitting the raw sum answers 89.99999999999999 and fails; so does
  #     comparing the rounded revenue against an unrounded max, the v2 bug,
  #     which now keeps both tied rows instead of one.
  #   - it ties Kettle at a rounded 90.0, so the tie-break is load-bearing too.
  #     Dropping ", p.name ASC" answers Kettle and fails. Iron sorts before
  #     Kettle, so the tie-break picks the name the prompt promises.
  # The graded answer therefore moves: January is now Iron, not Kettle. That
  # break is the point — the old answer was only safe because the seed never
  # asked the question. The tied and fractional-cent fixtures in
  # tests/test_sql_task.py still pin their own expectations unchanged, and
  # v4's "answer unchanged" property is deliberately not preserved here.
  #
  # Residual limit, still disclosed. ROUND(..., 0) is not graded by this seed:
  # both January maxima land on a whole number, so rounding to 0 decimals
  # returns the same value. Grading it would need a winner with a non-zero
  # cents part, which would move the February answer too and break the
  # fractional-cent fixture's pinned 80.0. That gap is a property of the
  # numbers, not an oversight; docs/task-spec.md's rule is that seed values
  # must exercise the comparison, and this seed exercises two of the three.
  #
  # SQLite floor: ROW_NUMBER() needs sqlite >= 3.25. That floor is pre-existing,
  # not introduced here — v2's MAX(...) OVER (...) is also a window function,
  # and 3.25.0 is the release that added them. Nothing in the project pins it;
  # tests/test_sql_task.py asserts it instead. An old sqlite fails loudly
  # (reference_sql returns executed=False), so this is a contributor-environment
  # risk, not a silent-wrong-answer risk.
  version: "5"
  ordered: true
  schema:
    - "CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL)"
    - "CREATE TABLE orders (id INTEGER PRIMARY KEY, placed_on DATE NOT NULL, status TEXT NOT NULL)"
    - "CREATE TABLE order_lines (order_id INTEGER NOT NULL REFERENCES orders(id), product_id INTEGER NOT NULL REFERENCES products(id), qty INTEGER NOT NULL, unit_price REAL NOT NULL)"
  seed:
    - "INSERT INTO products VALUES (1, 'Kettle'), (2, 'Grinder'), (3, 'Dripper'), (4, 'Iron')"
    - "INSERT INTO orders (id, placed_on, status) VALUES (1, '2025-01-03', 'shipped'), (2, '2025-01-11', 'cancelled'), (3, '2025-01-20', 'shipped'), (4, '2025-02-02', 'shipped'), (5, '2025-02-14', 'shipped'), (6, '2025-02-21', 'pending')"
    - "INSERT INTO order_lines VALUES (1, 1, 2, 30.0), (1, 3, 1, 12.5), (2, 2, 5, 40.0), (3, 2, 1, 40.0), (3, 1, 1, 30.0), (1, 4, 3, 29.68), (3, 4, 1, 0.96), (4, 3, 4, 12.5), (5, 2, 2, 40.0), (5, 1, 1, 30.0), (6, 1, 9, 30.0)"
  reference_sql: |
    SELECT month, product, revenue FROM (
      SELECT strftime('%Y-%m', o.placed_on) AS month,
             p.name AS product,
             ROUND(SUM(ol.qty * ol.unit_price), 2) AS revenue,
             ROW_NUMBER() OVER (
               PARTITION BY strftime('%Y-%m', o.placed_on)
               ORDER BY ROUND(SUM(ol.qty * ol.unit_price), 2) DESC, p.name ASC
             ) AS rn
      FROM order_lines ol
      JOIN orders o ON o.id = ol.order_id
      JOIN products p ON p.id = ol.product_id
      WHERE o.status = 'shipped'
      GROUP BY month, p.name
    ) t
    WHERE rn = 1
    ORDER BY month ASC
