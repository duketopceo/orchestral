<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<!-- The Score, U4: "Engraved 16" icon set and the five Rests (DESIGN.md A4, A7).
     Hand-drawn for orchestral. 16px grid, 1.5px stroke, square caps and joins,
     fills only on state glyphs, currentColor only (colour comes from CSS).
     Use: <svg class="i"><use href="#i-pass"/></svg>  (aria-hidden, text beside it). -->
<defs>
  <!-- currentColor here resolves from this sprite element, not the user; app.css sets a color rule on #hatch (ink-2). -->
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5"/>
  </pattern>
</defs>

<!-- navigation -->
<symbol id="i-overview" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 2.75h4v4h-4zM9.25 2.75h4v4h-4zM2.75 9.25h4v4h-4zM9.25 9.25h4v4h-4z"/></symbol>
<symbol id="i-runs" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2 3.5h1M6 3.5h8M2 8h1M6 8h8M2 12.5h1M6 12.5h8"/></symbol>
<symbol id="i-leaderboard" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 13.25V8.75h3v4.5M6.5 13.25v-10.5h3v10.5M10.25 13.25v-7.5h3v7.5"/></symbol>
<symbol id="i-compare" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 2.75h4v10.5h-4zM9.25 2.75h4v10.5h-4z"/></symbol>
<symbol id="i-cards" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 3.25h10.5v9.5H2.75zM2.75 6.75h10.5M5 10h4"/></symbol>
<symbol id="i-models" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M4.75 4.75h6.5v6.5h-6.5zM6.5 2v2.75M9.5 2v2.75M6.5 11.25V14M9.5 11.25V14M2 6.5h2.75M2 9.5h2.75M11.25 6.5H14M11.25 9.5H14"/></symbol>
<symbol id="i-help" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="8" r="5.75"/><path d="M6.25 6.4C6.25 5.3 7 4.75 8 4.75s1.75.6 1.75 1.6c0 1.5-1.75 1.4-1.75 2.9M8 11.25v.5"/></symbol>
<symbol id="i-new-run" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 3v10M3 8h10"/></symbol>

<!-- verdicts and states: outcome is carried by shape and fill, so it survives grayscale -->
<symbol id="i-live" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="8" r="5.75"/><circle cx="8" cy="8" r="3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-stalled" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 1.75L14.25 8 8 14.25 1.75 8zM8 5.25v3.25M8 10.5v.5"/></symbol>
<symbol id="i-pass" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M2 2h12v12H2zM3.97 8.83L5.03 7.77 6.97 9.71 10.94 5.3 12.06 6.3 7.03 11.89z"/></symbol>
<symbol id="i-fail" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 2.75h10.5v10.5H2.75zM5.25 10.75l5.5-5.5"/></symbol>
<symbol id="i-cancelled" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path stroke-dasharray="2.5 2" d="M2.75 2.75h10.5v10.5H2.75z"/></symbol>
<symbol id="i-inconclusive" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 2.75h10.5v10.5H2.75z"/><path fill="currentColor" stroke="none" d="M2 2h6v12H2z"/></symbol>
<symbol id="i-not-judged" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="8" r="5.25"/></symbol>
<symbol id="i-judge" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.25 12.25a5.75 5.75 0 0 1 11.5 0zM8 12.25l2.75-4"/></symbol>
<symbol id="i-low-n" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.75 2.75h10.5v10.5H2.75zM4.5 7.5l3-3M4.5 11.5l7-7M8.5 11.5l3-3"/></symbol>
<symbol id="i-frontier" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 13.5v-3h3.5v-3h3.5v-3h4M2.5 13.5H14"/></symbol>

<!-- measures -->
<symbol id="i-cost" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 4h6M3.5 8h9M2 12h12"/></symbol>
<symbol id="i-latency" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="9.25" r="4.75"/><path d="M8 9.25V6.5M6.5 2h3M8 2v2.5"/></symbol>
<symbol id="i-tokens" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 7l5-4 5 4M3 13l5-4 5 4"/></symbol>

<!-- flags: fermata = hold here, rest = set aside -->
<symbol id="i-flag-interesting" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.5 9.5a5.5 5.5 0 0 1 11 0"/><circle cx="8" cy="11.5" r="1.25" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-flag-dismiss" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2 6.25h12"/><path fill="currentColor" stroke="none" d="M5 6.25h6v3.25H5z"/></symbol>

<!-- evidence -->
<symbol id="i-artifact" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M3.25 2.75h6l3.5 3.5v7h-9.5zM9.25 2.75v3.5h3.5"/></symbol>
<symbol id="i-transcript" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2 3.5h12M2 7h12M2 10.5h8M2 14h10"/></symbol>
<symbol id="i-plan" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2 7h12M2 10h12M2 13h12M4 2.5v4.5M8 2.5v4.5M12 2.5v4.5"/></symbol>
<symbol id="i-manifest" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6.25 2l-1 12M11.25 2l-1 12M2.5 5.5h11M2.5 10.5h11"/></symbol>

<!-- actions -->
<symbol id="i-external" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M7 3.25H3.25v9.5h9.5V9M9.5 2.75h3.75v3.75M13.25 2.75L7.5 8.5"/></symbol>
<symbol id="i-download" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M8 2.5v7.5M4.5 6.75L8 10.25l3.5-3.5M2.5 13.5h11"/></symbol>
<symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M5.75 5.75h7.5v7.5h-7.5zM10.25 5.75v-3h-7.5v7.5h3"/></symbol>
<symbol id="i-filter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M2.25 3.25h11.5L9.5 8.5v4.25l-3-1.5V8.5z"/></symbol>
<symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></symbol>
<symbol id="i-sort" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 13V3M2.5 5.5L5 3l2.5 2.5M11 3v10M8.5 10.5L11 13l2.5-2.5"/></symbol>
<symbol id="i-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 6l4 4 4-4"/></symbol>
<symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></symbol>
<symbol id="i-keyboard" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M1.75 3.75h12.5v8.5H1.75zM4.5 6.75h1M7.5 6.75h1M10.5 6.75h1M5 9.5h6"/></symbol>
<symbol id="i-theme" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="8" r="5.5"/><path fill="currentColor" stroke="none" d="M8 2.5a5.5 5.5 0 0 0 0 11z"/></symbol>

<!-- Rests (A7): 64px monoline, empty states as silence on purpose -->
<symbol id="r-empty" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 24h52M6 32h52M6 40h52"/><path d="M26 32h12v6H26z"/></symbol>
<symbol id="r-nomatch" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 42h52M6 49h52M6 56h52"/><circle cx="29" cy="21" r="12"/><path d="M38 30l9 9"/><path d="M22 24a7 7 0 0 1 14 0"/><circle cx="29" cy="24.5" r="1.5" fill="currentColor" stroke="none"/></symbol>
<symbol id="r-starting" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 24h52M6 32h52M6 40h52"/><path d="M18 6l17 17"/></symbol>
<symbol id="r-missing" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 24h52M6 40h52"/><path d="M6 32h20l3-4 6 8 3-4h16"/></symbol>
<symbol id="r-error" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 24h52M6 32h52M6 40h52"/><path d="M42 24v16M50 24v16"/><path fill="currentColor" stroke="none" d="M49 24h4v16h-4z"/></symbol>
</svg>
