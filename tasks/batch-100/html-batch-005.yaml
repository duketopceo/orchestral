id: html-batch-005
type: html
prompt: Create a landing page for a coffee roaster targeted at climate-conscious consumers.
  Write a strong headline, a 2-3 sentence value proposition, three feature bullets,
  and a call-to-action button. Output a single self-contained HTML file with inline
  CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - roast
  pattern: climate|carbon|sustainab|eco[ -]?friendly|emission|planet|renewable|footprint|greenhouse|net[
    -]zero|lower your impact|environmentally
