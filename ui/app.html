<!doctype html>
<html lang="en" data-default-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F8F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1012" media="(prefers-color-scheme: dark)">
<title>orchestral · observatory</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
/* pre-paint: stored choice, else the shell default (local = system, hosted = paper) */
(function () {
  var d = document.documentElement, t = d.getAttribute("data-default-theme") || "system";
  try { var s = localStorage.getItem("orchestral.theme"); if (s === "paper" || s === "stage" || s === "system") t = s; } catch (e) {}
  d.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="/static/tokens.css?v=__V__">
<link rel="stylesheet" href="/static/app.css?v=__V__">
</head>
<body>
<div id="shell">
  <aside id="rail">
    <a class="brand" href="#/">
      <span class="brand-mark">◆</span>
      <span class="brand-word">orchestral</span>
      <span class="brand-sub">observatory</span>
    </a>
    <nav id="nav">
      <div class="nav-sec">Explore</div>
      <a href="#/" data-route="/">Overview</a>
      <a href="#/runs" data-route="/runs">Runs</a>
      <a href="#/leaderboard" data-route="/leaderboard">Leaderboard</a>
      <a href="#/compare" data-route="/compare">Compare</a>
      <div class="nav-sec">Catalog</div>
      <a href="#/models" data-route="/models">Models</a>
      <a href="#/cards" data-route="/cards">Cards</a>
      <a href="#/about" data-route="/about">About</a>
      <a class="nav-cta" href="#/new" data-route="/new">+ New run</a>
    </nav>
    <div id="rail-live">
      <div class="rail-live-head">Activity</div>
      <div id="rail-jobs"></div>
    </div>
    <button id="theme-toggle" type="button" aria-label="Colour theme"></button>
  </aside>
  <main id="main">
    <div id="view"><div class="loading">Loading…</div></div>
  </main>
</div>
<script src="/static/theme.js?v=__V__"></script>
<script src="/static/app.js?v=__V__"></script>
</body>
</html>
