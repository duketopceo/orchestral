name: orchestral eval

on:
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Task id from tasks/*.yaml"
        required: true
        default: "landing-page-coffee"
      orchestrator:
        description: "OpenRouter model slug for the orchestrator"
        required: true
        default: "deepseek/deepseek-v4-flash-0731"
      worker:
        description: "OpenRouter model slug for the worker"
        required: true
        default: "z-ai/glm-5.3-flash"
      planner:
        description: "Planner strategy: raw or ce-plan"
        required: true
        default: "raw"
      max_cost_usd:
        description: "Cap in USD, compared against provider-billed cost. Blank uses 0.05."
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # Secrets aren't available to fork PRs — skip the paid eval there instead
    # of failing every external contribution.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TASK: ${{ inputs.task || 'landing-page-coffee' }}
      ORCHESTRATOR: ${{ inputs.orchestrator || 'deepseek/deepseek-v4-flash-0731' }}
      WORKER: ${{ inputs.worker || 'z-ai/glm-5.3-flash' }}
      PLANNER: ${{ inputs.planner || 'raw' }}
      # One source of truth for the cap: the dispatch input overrides it, and
      # the shell default below covers pull_request events, where `inputs` is
      # always empty. A literal here as well would silently win on PR runs and
      # make the dispatch input a no-op.
      MAX_COST_USD: ${{ inputs.max_cost_usd }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestral
        run: pip install -e .

      - name: Run eval
        run: python3 harness.py run --task "$TASK" --orchestrator "$ORCHESTRATOR" --worker "$WORKER" --planner "$PLANNER"

      - name: Generate reports
        run: |
          python3 harness.py dashboard
          python3 harness.py report --html
          python3 harness.py report > reports/summary.txt

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: orchestral-reports
          path: reports/

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('reports/summary.txt', 'utf8');
            const body = `## orchestral eval\n\n\`\`\`\n${summary}\n\`\`\`\n\nReports are attached as the \`orchestral-reports\` artifact.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      # A cost cap bounds spend. It is not a containment control, and never was.
      #
      # The cap is compared against `calls.api_cost_usd` — the figure the
      # provider puts in its own response — not against the harness's
      # configured rate-card estimate. On 2026-09-26 the estimate understated
      # real spend 5.3x, so the old `runs.total_cost_usd` check passed 83 runs
      # that were charged $3.12. See orchestral/budget.py and DUK-214.
      #
      # The step runs on every paid eval, dispatch included, not only on
      # pull_request: the cap is a spend control, and a manual run spends the
      # same money. Fork PRs never reach it — the job-level `if` above skips
      # them before any step runs.
      - name: Enforce cost budget
        run: python3 -m orchestral.budget --runs-dir runs --max-cost-usd "${MAX_COST_USD:-0.001}"

      # DECLINED as a blocking gate, on purpose (DUK-214 AC #3).
      #
      # `harness.py prices` compares the configured rate card against the
      # provider's billed figure, and it is the right detector for a stale
      # models/*.yaml. It is not wired in as a gate because it cannot fail
      # today: `pricing_drift()` only considers rows whose `pricing_source` is
      # "api_reported", and the call paths the eval actually takes hardcode
      # "configured" (orchestral/planners.py, orchestral/judge.py). Measured
      # 2026-09-26: 183 real calls, 183 with `api_cost_usd` set, 0 labelled
      # "api_reported". A gate over a set that is structurally empty is a gate
      # that always passes, which is the same defect this issue is closing.
      #
      # It also is the wrong control. Stale rates are a hygiene defect, not
      # overspend, and a mid-eval provider reprice would redden every PR for a
      # reason unrelated to the change under test.
      #
      # Revisit once the labelling defect is fixed. Until then this step reports
      # the drift so the number is visible in the log; it never fails the job.
      - name: Report pricing drift (informational, non-blocking)
        if: always()
        run: python3 harness.py prices || echo "::warning::pricing drift check is inert until pricing_source is labelled api_reported"
