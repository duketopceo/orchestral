id: v3-boltons-namedutils-empty
title: 'boltons: namedutils rejects empty names'
blurb: Repair a real namedutils defect — empty type/field names crash with IndexError instead of ValueError — graded by pytest in a sandboxed checkout.
type: code
prompt: 'You are contributing to `boltons` (a library of Python stdlib

  extensions). A user filed this issue:


  > `boltons.namedutils.namedtuple` and `namedlist` are supposed to validate

  > type names and field names with `ValueError`, but empty strings slip

  > through: `all(...)` is vacuously true for `''''`, so the name reaches the

  > first-character check and dies with `IndexError` instead.

  >

  > Reproducer:

  >

  >     >>> namedtuple('''', [''x'', ''y''])

  >     IndexError        # expected ValueError

  >     >>> namedlist(''Point'', [''x'', ''''])

  >     IndexError        # expected ValueError

  >

  > Both factories must raise `ValueError` for an empty type name or an empty

  > field name. Names containing invalid characters (e.g. `''y-z''`) must still

  > raise `ValueError`, keyword names too, and valid names must still work.


  Fix `boltons/namedutils.py` and return the complete modified file as

  `{"files": [{"path": "boltons/namedutils.py", "content": "..."}]}`.

  The harness overlays your files onto a full repo checkout and runs the

  project''s test suite.'
metadata:
  human_minutes: 20
  canary: "orc-canary-3afb4ca3ef73a7f2"
  fixture: boltons-namedutils
  workdir: repo
  expected_paths:
  - boltons/namedutils.py
  setup_commands:
  - python -m pip install --quiet --no-index --find-links /home/user/wheelhouse pytest
  verify:
    command:
    - python
    - -m
    - pytest
    - tests/test_v3_namedutils.py
    - -x
    - -q
    fail_to_pass:
    - test_empty_field_name_raises_value_error
    - test_empty_type_name_raises_value_error
    - test_invalid_character_still_raises_value_error
    - test_valid_names_still_accepted
  timeout_seconds: 240
  difficulty: standard
  archetype: bugfix
  contamination_risk: medium
  reference:
    boltons/namedutils.py: "# Copyright (c) 2013, Mahmoud Hashemi\n#\n# Redistribution and use in source and binary forms, with or without\n# modification, are permitted provided that the following conditions are\n# met:\n#\n#    * Redistributions of source code must retain the above copyright\n#      notice, this list of conditions and the following disclaimer.\n#\n#    * Redistributions in binary form must reproduce the above\n#      copyright notice, this list of conditions and the following\n#      disclaimer in the documentation and/or other materials provided\n#      with the distribution.\n#\n#    * The names of the contributors may not be used to endorse or\n#      promote products derived from this software without specific\n#      prior written permission.\n#\n# THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS\n# \"AS IS\" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT\n# LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR\n# A PARTICULAR\
      \ PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT\n# OWNER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL,\n# SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT\n# LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE,\n# DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY\n# THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT\n# (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE\n# OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.\n\n\"\"\"\\\nThe ``namedutils`` module defines two lightweight container types:\n:class:`namedtuple` and :class:`namedlist`. Both are subtypes of built-in\nsequence types, which are very fast and efficient. They simply add\nnamed attribute accessors for specific indexes within themselves.\n\nThe :class:`namedtuple` is identical to the built-in\n:class:`collections.namedtuple`, with a couple of enhancements,\nincluding a ``__repr__``\
      \ more suitable to inheritance.\n\nThe :class:`namedlist` is the mutable counterpart to the\n:class:`namedtuple`, and is much faster and lighter-weight than\nfull-blown :class:`object`. Consider this if you're implementing nodes\nin a tree, graph, or other mutable data structure. If you want an even\nskinnier approach, you'll probably have to look to C.\n\"\"\"\n\n\nimport sys as _sys\nfrom collections import OrderedDict\nfrom keyword import iskeyword as _iskeyword\nfrom operator import itemgetter as _itemgetter\n\n\n__all__ = ['namedlist', 'namedtuple']\n\n# Tiny templates\n\n_repr_tmpl = '{name}=%r'\n\n_imm_field_tmpl = '''\\\n    {name} = _property(_itemgetter({index:d}), doc='Alias for field {index:d}')\n'''\n\n_m_field_tmpl = '''\\\n    {name} = _property(_itemgetter({index:d}), _itemsetter({index:d}), doc='Alias for field {index:d}')\n'''\n\n#################################################################\n### namedtuple\n#################################################################\n\
      \n_namedtuple_tmpl = '''\\\nclass {typename}(tuple):\n    '{typename}({arg_list})'\n\n    __slots__ = ()\n\n    _fields = {field_names!r}\n\n    def __new__(_cls, {arg_list}):  # TODO: tweak sig to make more extensible\n        'Create new instance of {typename}({arg_list})'\n        return _tuple.__new__(_cls, ({arg_list}))\n\n    @classmethod\n    def _make(cls, iterable, new=_tuple.__new__, len=len):\n        'Make a new {typename} object from a sequence or iterable'\n        result = new(cls, iterable)\n        if len(result) != {num_fields:d}:\n            raise TypeError('Expected {num_fields:d}'\n                            ' arguments, got %d' % len(result))\n        return result\n\n    def __repr__(self):\n        'Return a nicely formatted representation string'\n        tmpl = self.__class__.__name__ + '({repr_fmt})'\n        return tmpl % self\n\n    def _asdict(self):\n        'Return a new OrderedDict which maps field names to their values'\n        return OrderedDict(zip(self._fields,\
      \ self))\n\n    def _replace(_self, **kwds):\n        'Return a new {typename} object replacing field(s) with new values'\n        result = _self._make(map(kwds.pop, {field_names!r}, _self))\n        if kwds:\n            raise ValueError('Got unexpected field names: %r' % kwds.keys())\n        return result\n\n    def __getnewargs__(self):\n        'Return self as a plain tuple.  Used by copy and pickle.'\n        return tuple(self)\n\n    __dict__ = _property(_asdict)\n\n    def __getstate__(self):\n        'Exclude the OrderedDict from pickling'  # wat\n        pass\n\n{field_defs}\n'''\n\ndef namedtuple(typename, field_names, verbose=False, rename=False):\n    \"\"\"Returns a new subclass of tuple with named fields.\n\n    >>> Point = namedtuple('Point', ['x', 'y'])\n    >>> Point.__doc__                   # docstring for the new class\n    'Point(x, y)'\n    >>> p = Point(11, y=22)             # instantiate with pos args or keywords\n    >>> p[0] + p[1]                     # indexable\
      \ like a plain tuple\n    33\n    >>> x, y = p                        # unpack like a regular tuple\n    >>> x, y\n    (11, 22)\n    >>> p.x + p.y                       # fields also accessible by name\n    33\n    >>> d = p._asdict()                 # convert to a dictionary\n    >>> d['x']\n    11\n    >>> Point(**d)                      # convert from a dictionary\n    Point(x=11, y=22)\n    >>> p._replace(x=100)               # _replace() is like str.replace() but targets named fields\n    Point(x=100, y=22)\n    \"\"\"\n\n    # Validate the field names.  At the user's option, either generate an error\n    # message or automatically replace the field name with a valid name.\n    if isinstance(field_names, str):\n        field_names = field_names.replace(',', ' ').split()\n    field_names = [str(x) for x in field_names]\n    if rename:\n        seen = set()\n        for index, name in enumerate(field_names):\n            if (not all(c.isalnum() or c == '_' for c in name)\n     \
      \           or _iskeyword(name)\n                or not name\n                or name[0].isdigit()\n                or name.startswith('_')\n                or name in seen):\n                field_names[index] = '_%d' % index\n            seen.add(name)\n    for name in [typename] + field_names:\n        if not name or not all(c.isalnum() or c == '_' for c in name):\n            raise ValueError('Type names and field names must be non-empty '\n                             'and can only contain alphanumeric characters '\n                             'and underscores: %r' % name)\n        if _iskeyword(name):\n            raise ValueError('Type names and field names cannot be a '\n                             'keyword: %r' % name)\n        if name[0].isdigit():\n            raise ValueError('Type names and field names cannot start with '\n                             'a number: %r' % name)\n    seen = set()\n    for name in field_names:\n        if name.startswith('_') and not rename:\n\
      \            raise ValueError('Field names cannot start with an underscore: '\n                             '%r' % name)\n        if name in seen:\n            raise ValueError('Encountered duplicate field name: %r' % name)\n        seen.add(name)\n\n    # Fill-in the class template\n    fmt_kw = {'typename': typename}\n    fmt_kw['field_names'] = tuple(field_names)\n    fmt_kw['num_fields'] = len(field_names)\n    fmt_kw['arg_list'] = repr(tuple(field_names)).replace(\"'\", \"\")[1:-1]\n    fmt_kw['repr_fmt'] = ', '.join(_repr_tmpl.format(name=name)\n                                   for name in field_names)\n    fmt_kw['field_defs'] = '\\n'.join(_imm_field_tmpl.format(index=index, name=name)\n                                     for index, name in enumerate(field_names))\n    class_definition = _namedtuple_tmpl.format(**fmt_kw)\n\n    if verbose:\n        print(class_definition)\n\n    # Execute the template string in a temporary namespace and support\n    # tracing utilities by\
      \ setting a value for frame.f_globals['__name__']\n    namespace = dict(_itemgetter=_itemgetter,\n                     __name__='namedtuple_%s' % typename,\n                     OrderedDict=OrderedDict,\n                     _property=property,\n                     _tuple=tuple)\n    try:\n        exec(class_definition, namespace)\n    except SyntaxError as e:\n        raise SyntaxError(e.msg + ':\\n' + class_definition)\n    result = namespace[typename]\n\n    # For pickling to work, the __module__ variable needs to be set to the frame\n    # where the named tuple is created.  Bypass this step in environments where\n    # sys._getframe is not defined (Jython for example) or sys._getframe is not\n    # defined for arguments greater than 0 (IronPython).\n    try:\n        frame = _sys._getframe(1)\n        result.__module__ = frame.f_globals.get('__name__', '__main__')\n    except (AttributeError, ValueError):\n        pass\n\n    return result\n\n\n#################################################################\n\
      ### namedlist\n#################################################################\n\n_namedlist_tmpl = '''\\\nclass {typename}(list):\n    '{typename}({arg_list})'\n\n    __slots__ = ()\n\n    _fields = {field_names!r}\n\n    def __new__(_cls, {arg_list}):  # TODO: tweak sig to make more extensible\n        'Create new instance of {typename}({arg_list})'\n        return _list.__new__(_cls, ({arg_list}))\n\n    def __init__(self, {arg_list}):  # tuple didn't need this but list does\n        return _list.__init__(self, ({arg_list}))\n\n    @classmethod\n    def _make(cls, iterable, new=_list, len=len):\n        'Make a new {typename} object from a sequence or iterable'\n        # why did this function exist? why not just star the\n        # iterable like below?\n        result = cls(*iterable)\n        if len(result) != {num_fields:d}:\n            raise TypeError('Expected {num_fields:d} arguments,'\n                            ' got %d' % len(result))\n        return result\n\n    def\
      \ __repr__(self):\n        'Return a nicely formatted representation string'\n        tmpl = self.__class__.__name__ + '({repr_fmt})'\n        return tmpl % tuple(self)\n\n    def _asdict(self):\n        'Return a new OrderedDict which maps field names to their values'\n        return OrderedDict(zip(self._fields, self))\n\n    def _replace(_self, **kwds):\n        'Return a new {typename} object replacing field(s) with new values'\n        result = _self._make(map(kwds.pop, {field_names!r}, _self))\n        if kwds:\n            raise ValueError('Got unexpected field names: %r' % kwds.keys())\n        return result\n\n    def __getnewargs__(self):\n        'Return self as a plain list.  Used by copy and pickle.'\n        return tuple(self)\n\n    __dict__ = _property(_asdict)\n\n    def __getstate__(self):\n        'Exclude the OrderedDict from pickling'  # wat\n        pass\n\n{field_defs}\n'''\n\n\ndef namedlist(typename, field_names, verbose=False, rename=False):\n    \"\"\"Returns\
      \ a new subclass of list with named fields.\n\n    >>> Point = namedlist('Point', ['x', 'y'])\n    >>> Point.__doc__                   # docstring for the new class\n    'Point(x, y)'\n    >>> p = Point(11, y=22)             # instantiate with pos args or keywords\n    >>> p[0] + p[1]                     # indexable like a plain list\n    33\n    >>> x, y = p                        # unpack like a regular list\n    >>> x, y\n    (11, 22)\n    >>> p.x + p.y                       # fields also accessible by name\n    33\n    >>> d = p._asdict()                 # convert to a dictionary\n    >>> d['x']\n    11\n    >>> Point(**d)                      # convert from a dictionary\n    Point(x=11, y=22)\n    >>> p._replace(x=100)               # _replace() is like str.replace() but targets named fields\n    Point(x=100, y=22)\n    \"\"\"\n\n    # Validate the field names.  At the user's option, either generate an error\n    # message or automatically replace the field name with a valid name.\n\
      \    if isinstance(field_names, str):\n        field_names = field_names.replace(',', ' ').split()\n    field_names = [str(x) for x in field_names]\n    if rename:\n        seen = set()\n        for index, name in enumerate(field_names):\n            if (not all(c.isalnum() or c == '_' for c in name)\n                or _iskeyword(name)\n                or not name\n                or name[0].isdigit()\n                or name.startswith('_')\n                or name in seen):\n                field_names[index] = '_%d' % index\n            seen.add(name)\n    for name in [typename] + field_names:\n        if not name or not all(c.isalnum() or c == '_' for c in name):\n            raise ValueError('Type names and field names must be non-empty '\n                             'and can only contain alphanumeric characters '\n                             'and underscores: %r' % name)\n        if _iskeyword(name):\n            raise ValueError('Type names and field names cannot be a '\n\
      \                             'keyword: %r' % name)\n        if name[0].isdigit():\n            raise ValueError('Type names and field names cannot start with '\n                             'a number: %r' % name)\n    seen = set()\n    for name in field_names:\n        if name.startswith('_') and not rename:\n            raise ValueError('Field names cannot start with an underscore: '\n                             '%r' % name)\n        if name in seen:\n            raise ValueError('Encountered duplicate field name: %r' % name)\n        seen.add(name)\n\n    # Fill-in the class template\n    fmt_kw = {'typename': typename}\n    fmt_kw['field_names'] = tuple(field_names)\n    fmt_kw['num_fields'] = len(field_names)\n    fmt_kw['arg_list'] = repr(tuple(field_names)).replace(\"'\", \"\")[1:-1]\n    fmt_kw['repr_fmt'] = ', '.join(_repr_tmpl.format(name=name)\n                                   for name in field_names)\n    fmt_kw['field_defs'] = '\\n'.join(_m_field_tmpl.format(index=index,\
      \ name=name)\n                                     for index, name in enumerate(field_names))\n    class_definition = _namedlist_tmpl.format(**fmt_kw)\n\n    if verbose:\n        print(class_definition)\n\n    def _itemsetter(key):\n        def _itemsetter(obj, value):\n            obj[key] = value\n        return _itemsetter\n\n    # Execute the template string in a temporary namespace and support\n    # tracing utilities by setting a value for frame.f_globals['__name__']\n    namespace = dict(_itemgetter=_itemgetter,\n                     _itemsetter=_itemsetter,\n                     __name__='namedlist_%s' % typename,\n                     OrderedDict=OrderedDict,\n                     _property=property,\n                     _list=list)\n    try:\n        exec(class_definition, namespace)\n    except SyntaxError as e:\n        raise SyntaxError(e.msg + ':\\n' + class_definition)\n    result = namespace[typename]\n\n    # For pickling to work, the __module__ variable needs to\
      \ be set to\n    # the frame where the named list is created.  Bypass this step in\n    # environments where sys._getframe is not defined (Jython for\n    # example) or sys._getframe is not defined for arguments greater\n    # than 0 (IronPython).\n    try:\n        frame = _sys._getframe(1)\n        result.__module__ = frame.f_globals.get('__name__', '__main__')\n    except (AttributeError, ValueError):\n        pass\n\n    return result\n"
  test_files:
    tests/test_v3_namedutils.py: "\"\"\"Verifier oracle for empty-name rejection — mirrors upstream fix commit\n970051b664 (BSD-3-Clause, boltons). Staged after the worker fileset.\"\"\"\nimport pytest\n\nfrom boltons.namedutils import namedlist, namedtuple\n\n\n@pytest.mark.parametrize(\"factory\", [namedtuple, namedlist])\ndef test_empty_field_name_raises_value_error(factory):\n    # `all()` is True for the empty string, so an empty name used to pass both\n    # ValueError checks and reach `name[0].isdigit()`, raising IndexError.\n    with pytest.raises(ValueError):\n        factory('Point', ['x', ''])\n\n\n@pytest.mark.parametrize(\"factory\", [namedtuple, namedlist])\ndef test_empty_type_name_raises_value_error(factory):\n    with pytest.raises(ValueError):\n        factory('', ['x', 'y'])\n\n\n@pytest.mark.parametrize(\"factory\", [namedtuple, namedlist])\ndef test_invalid_character_still_raises_value_error(factory):\n    with pytest.raises(ValueError):\n        factory('Point', ['x',\
      \ 'y-z'])\n\n\n@pytest.mark.parametrize(\"factory\", [namedtuple, namedlist])\ndef test_valid_names_still_accepted(factory):\n    cls = factory('Point', ['x', 'y'])\n    assert cls(x=1, y=2).x == 1\n"
