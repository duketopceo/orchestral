id: html-batch-014
type: html
prompt: Create a landing page for a electric bike targeted at remote-first startups.
  Write a strong headline, a 2-3 sentence value proposition, three feature bullets,
  and a call-to-action button. Output a single self-contained HTML file with inline
  CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - bike
  pattern: remote[ -]?first|distributed|async|remote team|work from anywhere|hybrid|global
    team|timezone|time zone|hire anywhere
