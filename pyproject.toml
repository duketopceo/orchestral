[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestral"
version = "1.0.0"
description = "OpenRouter eval harness for orchestrator+worker model pairs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Luke Kimball"},
]
keywords = ["llm", "evaluation", "openrouter", "orchestration", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
shots = [
    "playwright>=1.40",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/duketopceo/orchestral"
Repository = "https://github.com/duketopceo/orchestral"
Issues = "https://github.com/duketopceo/orchestral/issues"

[project.scripts]
orchestral = "harness:main"

[tool.setuptools]
py-modules = ["harness"]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestral*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PIE", "PYI", "EXE", "W"]
ignore = [
    # Broad excepts are deliberate: retry loops, graceful degradation, and
    # "never crash the harness" paths catch Exception on purpose.
    "BLE001",
    # EventLogger intentionally holds a file handle open for the run session.
    "SIM115",
    # The orchestrator × worker multiplication sign is deliberate UI text.
    "RUF001", "RUF002",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
explicit_package_bases = true
exclude = "(tests|scripts|ui)"
