id: html-batch-018
type: html
prompt: Create a landing page for a electric bike targeted at product managers. Write
  a strong headline, a 2-3 sentence value proposition, three feature bullets, and
  a call-to-action button. Output a single self-contained HTML file with inline CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - bike
  pattern: product manager|product management|\bpm\b|roadmap review|sprint planning|backlog
    grooming|stakeholder|user research|prioriti[sz]|feature request|voice of the customer|product
    team|ship the right thing
