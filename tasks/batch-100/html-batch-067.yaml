id: html-batch-067
type: html
prompt: Create a landing page for a remote team retreat planner targeted at indie
  hackers. Write a strong headline, a 2-3 sentence value proposition, three feature
  bullets, and a call-to-action button. Output a single self-contained HTML file with
  inline CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - retreat
  pattern: indie|hacker|solo founder|bootstrapped|side project|side hustle|one[ -]person|ship
    fast|build in public|\bdoer\b
