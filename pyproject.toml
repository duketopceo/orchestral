[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestral"
version = "1.0.0"
description = "OpenRouter eval harness for orchestrator+worker model pairs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Luke Kimball"},
]
keywords = ["llm", "evaluation", "openrouter", "orchestration", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
shots = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/duketopceo/orchestral"
Repository = "https://github.com/duketopceo/orchestral"
Issues = "https://github.com/duketopceo/orchestral/issues"

[project.scripts]
orchestral = "harness:main"

[tool.setuptools]
py-modules = ["harness"]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestral*"]
