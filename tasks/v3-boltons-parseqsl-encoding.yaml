id: v3-boltons-parseqsl-encoding
title: 'boltons: parse_qsl honors encoding'
blurb: Repair a real urlutils defect — the encoding parameter is accepted but ignored — graded by pytest in a sandboxed repo checkout.
type: code
prompt: 'You are contributing to `boltons` (a library of Python stdlib

  extensions). A user filed this issue:


  > `boltons.urlutils.parse_qsl` accepts an `encoding` parameter, but it is

  > silently ignored — percent-encoded sequences are always decoded as UTF-8.

  >

  > Reproducer:

  >

  >     >>> parse_qsl(''k=%E9'', encoding=''latin-1'')

  >     [(''k'', ''\ufffd'')]        # expected [(''k'', ''\xe9'')]

  >

  > `%E9` is `é` in latin-1 and is not valid UTF-8, so the result should be

  > `''\xe9''` when `encoding=''latin-1''` is passed. The default behavior must

  > stay unchanged (undecodable bytes become `\ufffd`), and keys must be

  > decoded with the same encoding as values: `parse_qsl(''%E9=v'',

  > encoding=''latin-1'')` must return `[(''\xe9'', ''v'')]`.


  Fix `boltons/urlutils.py` and return the complete modified file as

  `{"files": [{"path": "boltons/urlutils.py", "content": "..."}]}`.

  The harness overlays your files onto a full repo checkout and runs the

  project''s test suite.'
metadata:
  canary: "orc-canary-aa3aafd8ff3ee6fc"
  fixture: boltons-parseqsl
  workdir: repo
  expected_paths:
  - boltons/urlutils.py
  setup_commands:
  - python -m pip install --quiet --no-index --find-links /home/user/wheelhouse pytest
  verify:
    command:
    - python
    - -m
    - pytest
    - tests/test_v3_parseqsl.py
    - -x
    - -q
    fail_to_pass:
    - test_parse_qsl_encoding
  timeout_seconds: 240
  difficulty: standard
  archetype: bugfix
  contamination_risk: medium
