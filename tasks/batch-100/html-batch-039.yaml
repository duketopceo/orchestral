id: html-batch-039
type: html
prompt: Create a landing page for a no-code automation tool targeted at data engineering
  teams. Write a strong headline, a 2-3 sentence value proposition, three feature
  bullets, and a call-to-action button. Output a single self-contained HTML file with
  inline CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - automat
  pattern: data engineer|data platform|data team|pipeline|warehouse|\betl\b|streaming|\bdbt\b|analytics
    engineer|airflow|\bspark\b|lakehouse|data ingestion|transformation
