id: html-batch-063
type: html
prompt: Create a landing page for a remote team retreat planner targeted at enterprise
  security teams. Write a strong headline, a 2-3 sentence value proposition, three
  feature bullets, and a call-to-action button. Output a single self-contained HTML
  file with inline CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - retreat
  pattern: security|compliance|soc ?2|zero trust|encrypt|audit|identity|access control|\brisk\b|governance|pen
    test|least privilege|threat
