id: code-expr-parser
title: "Expression parser"
blurb: "Write a real math-expression parser (+-*/, parens, unary minus) — eval() is banned."
type: code
prompt: |
  Implement a Python module `calc.py` with `evaluate(expr: str) -> float`.

  The expression language: numbers (ints and decimals), `+ - * /`,
  parentheses, unary minus, and standard precedence (`*`/`/` bind tighter
  than `+`/`-`). Examples: "2+3*4" → 14, "(2+3)*4" → 20, "-3 + -2" → -5,
  "10 / 4" → 2.5.

  Do NOT use eval() or exec() — write a real parser (tokenize + recursive
  descent or shunting-yard). Raise ValueError on malformed input.

  Return a JSON object {"files": [{"path": "calc.py", "content": "..."}]}
  with the complete module. No test file needed — the harness runs its own.
metadata:
  canary: "orc-canary-57419ef1ca55a599"
  module: calc.py
  expected_paths: [calc.py]
  timeout_seconds: 30
  max_code_lines: 200
  no_unsafe: true
  no_external_deps: true
  forbidden_patterns:
    - "\\beval\\s*\\("
    - "\\bexec\\s*\\("
  difficulty: medium
  reference:
    calc.py: |
      """Recursive-descent evaluator: + - * /, parens, unary minus."""


      def evaluate(expr: str) -> float:
          tokens = _tokenize(expr)
          pos = 0

          def peek():
              return tokens[pos] if pos < len(tokens) else None

          def take():
              nonlocal pos
              tok = tokens[pos]
              pos += 1
              return tok

          def parse_factor():
              tok = peek()
              if tok in ("-", "+"):
                  take()
                  value = parse_factor()
                  return -value if tok == "-" else value
              if tok == "(":
                  take()
                  value = parse_expr()
                  if peek() != ")":
                      raise ValueError("unbalanced parens")
                  take()
                  return value
              if tok is None or not isinstance(tok, str) or tok in "+-*/)":
                  raise ValueError(f"unexpected token: {tok!r}")
              take()
              try:
                  return float(tok)
              except ValueError as exc:
                  raise ValueError(f"bad number: {tok!r}") from exc

          def parse_term():
              value = parse_factor()
              while peek() in ("*", "/"):
                  op = take()
                  rhs = parse_factor()
                  value = value * rhs if op == "*" else value / rhs
              return value

          def parse_expr():
              value = parse_term()
              while peek() in ("+", "-"):
                  op = take()
                  rhs = parse_term()
                  value = value + rhs if op == "+" else value - rhs
              return value

          if not tokens:
              raise ValueError("empty expression")
          result = parse_expr()
          if pos != len(tokens):
              raise ValueError(f"trailing input at token {pos}")
          return result


      def _tokenize(expr: str) -> list:
          tokens = []
          i = 0
          while i < len(expr):
              ch = expr[i]
              if ch.isspace():
                  i += 1
              elif ch in "+-*/()":
                  tokens.append(ch)
                  i += 1
              elif ch.isdigit() or ch == ".":
                  j = i
                  while j < len(expr) and (expr[j].isdigit() or expr[j] == "."):
                      j += 1
                  tokens.append(expr[i:j])
                  i = j
              else:
                  raise ValueError(f"unexpected character: {ch!r}")
          return tokens
  tests: |
    import unittest
    from calc import evaluate

    class TestCalc(unittest.TestCase):
        def test_precedence(self):
            self.assertAlmostEqual(evaluate("2+3*4"), 14.0)
            self.assertAlmostEqual(evaluate("(2+3)*4"), 20.0)

        def test_division(self):
            self.assertAlmostEqual(evaluate("10 / 4"), 2.5)
            self.assertAlmostEqual(evaluate("8/2/2"), 2.0)

        def test_unary_minus(self):
            self.assertAlmostEqual(evaluate("-3 + -2"), -5.0)
            self.assertAlmostEqual(evaluate("-(4+1)"), -5.0)

        def test_whitespace_and_decimals(self):
            self.assertAlmostEqual(evaluate("  1.5 + 2.25 "), 3.75)

        def test_nested_parens(self):
            self.assertAlmostEqual(evaluate("((2+3)*(4-1))"), 15.0)

        def test_malformed_raises(self):
            for bad in ("2 +", "(1+2", "2 ** 3", "", "abc"):
                with self.assertRaises((ValueError, SyntaxError), msg=bad):
                    evaluate(bad)
