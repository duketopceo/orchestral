name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One gate per job, on purpose. GitHub Actions skips every remaining step in a
# job as soon as one step fails, so a single job meant a red `Tests` step
# silently skipped `Lint` and `Types` and the run could still look green.
# Separate jobs report independently: one red never hides the others.
# The suite job below is a matrix, so GitHub reports its check runs as
# `test-matrix (3.11)` through `test-matrix (3.14)` — never as a bare `test`.
# The job key is not the check name. Do not assume they match.
#
# That distinction is not academic. On 2026-09-26T16:58:50Z a ruleset was
# created on `main` requiring the context `test`, which was correct then: this
# job was not yet a matrix. Four hours later PR #68 merged the support-range
# matrix (#2914b9b) and the emitted names changed, so the required context
# became unproducible and every pull request was blocked. Nothing failed. A
# green guard test stood next to it the whole time, because it read the YAML job
# key rather than the name GitHub emits.
#
# When you change a job's name, its matrix, or its `name:` key, you change what
# branch protection must require. `.github/required-checks.json` records the
# required contexts and tests/test_required_check_contract.py fails if the
# workflow can no longer emit one. Update that file in the same change.
# See DUK-227.
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11" with no upper bound, so the
        # whole range is a support claim. Pin exact minors: a floating "3.14" would
        # silently become 3.15 and reopen the gap this closes. Floor plus every
        # minor we have actually run the suite on.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev,tui]

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Task-spec audit
        # Fails the build when a spec requests a check the runner cannot run.
        # Warnings are reported but do not gate: they mark known gaming surface.
        run: python harness.py audit --strict

      - name: Spec selfcheck
        # Replays each spec's own reference through its graders, then runs
        # hidden tests against reference implementations — this is the gate
        # that would have caught a suite contradicting its own spec.
        # --execute runs repo-authored content only, never model artifacts.
        run: python harness.py selfcheck --execute

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .[dev,tui]


      - name: Lint
        run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .[dev,tui]

      - name: Types
        run: mypy orchestral harness.py

  # Browser verification (KTD13). The Playwright tests skip in every other job
  # because `[shots]` is not installed there, which is how a layout regression
  # could pass `test-matrix` unseen. This job installs the extra plus Chromium and
  # runs the same suite, so they execute.
  #
  # It is deliberately NOT required and NOT in the `test` reporter's needs:
  # `.github/required-checks.json` stays `["test"]` until the user decides to
  # require it (plan, Open Questions). Making it required is two edits in one
  # change: add `browser` to the reporter's needs and result check, and to the
  # JSON. tests/test_ci_gate_independence.py pins the current shape.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .[dev,tui,shots]

      - name: Chromium
        run: python -m playwright install --with-deps chromium

      - name: Browser tests
        run: python -m unittest discover -s tests

  # The gate branch protection actually requires. Ruleset main-2 requires the
  # context `test`; a matrix job can never report that, because GitHub appends
  # the matrix value. This job is not a matrix, so it reports exactly `test`.
  #
  # `if: always()` is load-bearing, for the opposite reason to the obvious one.
  # GitHub reports a *skipped* job as "Success", and a skipped required check
  # does not block a merge. So without `always()` a failed dependency would skip
  # this job, this job would report Success, and the required context would be
  # satisfied by a red build. `always()` plus the `exit 1` below is the only
  # reason the context `test` means "every gate passed". It reports the gates'
  # result; it does not re-run them.
  test:
    runs-on: ubuntu-latest
    needs: [test-matrix, lint, types]
    if: always()
    steps:
      - name: Every gate passed
        env:
          TEST_MATRIX: ${{ needs.test-matrix.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
        run: |
          echo "test-matrix=$TEST_MATRIX lint=$LINT types=$TYPES"
          if [ "$TEST_MATRIX" != success ] || [ "$LINT" != success ] || [ "$TYPES" != success ]; then
            echo "::error::at least one CI gate did not pass"
            exit 1
          fi
          echo "all three gates passed"
