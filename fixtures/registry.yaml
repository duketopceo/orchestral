# Repo-fixture registry — the committed contract for v3 real-repo tasks.
#
# Each entry pins a public repository at an immutable commit. `harness.py
# fixtures fetch` downloads the codeload tarball, stages wheels for
# `verify_deps` into `wheelhouse/`, and writes a sha256 lock. Fetched blobs
# (`*.tar.gz`, `*.lock.json`) are gitignored — third-party code is never
# vendored into this repository.
#
# Gates enforced at load time (see orchestral/fixtures.py):
#   - repo: GitHub "org/name" (codeload fetch, no credentials)
#   - commit: full 40-hex sha — tags and branches are mutable, not allowed
#   - license: must be in the redistribution allowlist
#     (mit, bsd-2-clause, bsd-3-clause, apache-2.0, isc, psf-2.0, python-2.0)
#   - license_url: public https URL a reviewer can check
#   - verify_deps: every requirement pinned (pkg==version) — unpinned deps
#     resolve to different wheels on different days and the lock stops
#     meaning anything
#
# Contamination honesty: small/obscure repos and recent commits reduce — but
# do not eliminate — pretraining recall. Record the risk on each task's
# metadata.contamination_risk, not here.
fixtures:
  more-itertools-10.8:
    repo: more-itertools/more-itertools
    commit: 1ea82a711c69f590054987b5cb194157f8ce8ac4
    license: MIT
    license_url: https://github.com/more-itertools/more-itertools/blob/master/LICENSE
    verify_deps:
      - pytest==9.1.1
      - iniconfig==2.3.0
      - packaging==26.3
      - pluggy==1.6.0
      - pygments==2.21.0
    notes: >
      Pure-python iteration utilities; self-contained test suite, no
      third-party runtime deps. Moderate GitHub visibility (~3.5k stars) —
      contamination risk medium-low.
  boltons-25.1:
    repo: mahmoud/boltons
    commit: 4e5faa3d7e4008d89e0d8bf1ea87b6d9a061a16d
    license: BSD-3-Clause
    license_url: https://github.com/mahmoud/boltons/blob/master/LICENSE
    verify_deps: &boltons_deps
      - pytest==9.1.1
      - iniconfig==2.3.0
      - packaging==26.3
      - pluggy==1.6.0
      - pygments==2.21.0
    notes: >
      Broad stdlib-adjacent utility library; large function surface makes it
      good for feature-gap tasks. Moderate visibility (~7k stars).

  # Bugfix fixtures pin the PARENT of a real upstream fix commit: the repo
  # arrives broken and the fix's added tests become the oracle. The fix sha
  # is recorded in notes for provenance.
  boltons-parseqsl:
    repo: mahmoud/boltons
    commit: 967864f89791509f9eb36b22b4579d36b72a6df2
    license: BSD-3-Clause
    license_url: https://github.com/mahmoud/boltons/blob/master/LICENSE
    verify_deps: *boltons_deps
    notes: >
      Parent of d45cc414e3 ("urlutils: honor parse_qsl encoding (#455)").
      urlutils.parse_qsl accepts `encoding` but ignores it — keys and values
      always decode as UTF-8.
  boltons-namedutils:
    repo: mahmoud/boltons
    commit: 9decba3e5736f61180eec274420ced0e572e30e6
    license: BSD-3-Clause
    license_url: https://github.com/mahmoud/boltons/blob/master/LICENSE
    verify_deps: *boltons_deps
    notes: >
      Parent of 970051b664 ("namedutils: reject empty type and field names
      (#462)"). Empty type/field names slip past the ValueError checks and
      die on IndexError inside the factory.
  boltons-bits:
    repo: mahmoud/boltons
    commit: 5eb6cc045560abf320712f262346ae95fb66d448
    license: BSD-3-Clause
    license_url: https://github.com/mahmoud/boltons/blob/master/LICENSE
    verify_deps: *boltons_deps
    notes: >
      Parent of efff866a3b ("mathutils: preserve empty Bits through
      conversions (#468)"). Empty Bits round-trips crash/misformat across
      as_bin/as_hex/as_bytes and the from_* constructors.
  boltons-jsonl:
    repo: mahmoud/boltons
    commit: 5150802911edbf8ade1e7d1bfb346fed52c88d05
    license: BSD-3-Clause
    license_url: https://github.com/mahmoud/boltons/blob/master/LICENSE
    verify_deps: *boltons_deps
    notes: >
      Parent of 805c803ca7 ("jsonutils: align binary streams to binary
      newlines (#464)"). JSONLIterator._align_to_newline compares against a
      str '\n' while binary streams yield bytes, so rel_seek never aligns.
  boltons-barrellist:
    repo: mahmoud/boltons
    commit: 56161fec0ac7a1e5ba0577cc33c20bbdbb331728
    license: BSD-3-Clause
    license_url: https://github.com/mahmoud/boltons/blob/master/LICENSE
    verify_deps: *boltons_deps
    notes: >
      Parent of 574393a4c3 ("listutils: preserve barrel endpoints during
      slice deletion (#472)"). BarrelList slice deletion across barrels drops
      the stop barrel's head and maps stop=None/past-end to the wrong barrel.
