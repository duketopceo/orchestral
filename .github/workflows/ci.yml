name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11" with no upper bound, so the
        # whole range is a support claim. Pin exact minors: a floating "3.14" would
        # silently become 3.15 and reopen the gap this closes. Floor plus every
        # minor we have actually run the suite on.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev,tui]

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Task-spec audit
        # Fails the build when a spec requests a check the runner cannot run.
        # Warnings are reported but do not gate: they mark known gaming surface.
        run: python harness.py audit --strict

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy orchestral harness.py
