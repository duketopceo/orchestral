id: code-slugify
title: "Slugify"
blurb: "Turn arbitrary text into a clean URL slug."
type: code
prompt: |
  Implement a Python module `slugify.py` with `slugify(text: str) -> str`.

  Rules:
  - lowercase; replace any run of non-alphanumeric characters with a single "-"
  - strip leading/trailing "-"
  - transliterate common accents (é→e, ü→u, ñ→n) via unicodedata normalization
  - empty or all-punctuation input → ""

  Return a JSON object {"files": [{"path": "slugify.py", "content": "..."}]}
  with the complete module. No test file needed — the harness runs its own.
metadata:
  module: slugify.py
  expected_paths: [slugify.py]
  timeout_seconds: 30
  max_code_lines: 60
  no_unsafe: true
  no_external_deps: true
  tests: |
    import unittest
    from slugify import slugify

    class TestSlugify(unittest.TestCase):
        def test_basic(self):
            self.assertEqual(slugify("Hello World"), "hello-world")

        def test_punctuation_runs(self):
            self.assertEqual(slugify("a -- b!!c"), "a-b-c")

        def test_strip_edges(self):
            self.assertEqual(slugify("--Leading and trailing--"), "leading-and-trailing")

        def test_accents(self):
            self.assertEqual(slugify("Café Müller"), "cafe-muller")
            self.assertEqual(slugify("Señor"), "senor")

        def test_empty_and_garbage(self):
            self.assertEqual(slugify(""), "")
            self.assertEqual(slugify("!!!"), "")

        def test_case_and_digits(self):
            self.assertEqual(slugify("Python 3.11 Rocks"), "python-3-11-rocks")
