id: html-batch-049
type: html
prompt: Create a landing page for a dev-ops observability platform targeted at data
  engineering teams. Write a strong headline, a 2-3 sentence value proposition, three
  feature bullets, and a call-to-action button. Output a single self-contained HTML
  file with inline CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - observab
  pattern: data engineer|data platform|data team|pipeline|warehouse|\betl\b|streaming|\bdbt\b|analytics
    engineer|airflow|\bspark\b|lakehouse|data ingestion|transformation
