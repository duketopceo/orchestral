id: html-batch-001
type: html
prompt: Create a landing page for a coffee roaster targeted at small business owners.
  Write a strong headline, a 2-3 sentence value proposition, three feature bullets,
  and a call-to-action button. Output a single self-contained HTML file with inline
  CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - roast
  pattern: small business|small biz|\bsmb\b|local business|independent (?:business|shop|retailer)|shop
    owner|business owner|sole proprietor|main street|mom[- ]and[- ]pop|grow your business|run
    your business|boutique owner
