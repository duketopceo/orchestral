id: html-batch-070
type: html
prompt: Create a landing page for a carbon offset marketplace targeted at early adopters.
  Write a strong headline, a 2-3 sentence value proposition, three feature bullets,
  and a call-to-action button. Output a single self-contained HTML file with inline
  CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - carbon
  pattern: early adopter|early access|early bird|early|first[ -]?look|be the first|get
    early|first to try|first in line|waitlist|before everyone|founding (?:member|customer)|locked
    in early|head start
