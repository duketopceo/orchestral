id: html-batch-012
type: html
prompt: Create a landing page for a electric bike targeted at open-source developers.
  Write a strong headline, a 2-3 sentence value proposition, three feature bullets,
  and a call-to-action button. Output a single self-contained HTML file with inline
  CSS.
validation:
- html
- has_required
- matches_pattern
metadata:
  required:
  - bike
  pattern: open[ -]source|developer|dev team|contributor|codebase|self[ -]host|\bcli\b|api[-
    ]first|github|git repository|repository|readme|ship your own|for developers|by
    developers
