id: html-batch-093
type: html
prompt: Create a landing page for a smart home dashboard targeted at enterprise security
  teams. Write a strong headline, a 2-3 sentence value proposition, three feature
  bullets, and a call-to-action button. Output a single self-contained HTML file with
  inline CSS.
validation:
- html
- has_required
- matches_pattern
