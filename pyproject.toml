[project]
name = "orchestral"
version = "0.1.0"
description = "OpenRouter eval harness for orchestrator+worker model pairs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Luke Kimball"},
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
shots = [
    "playwright>=1.40",
]

[project.scripts]
orchestral = "harness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestral*"]
