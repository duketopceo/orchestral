id: v2-budget-config
title: "Budget: three-key config fix"
blurb: "Fix three config keys in as few commands as possible — command count is graded."
type: terminal
prompt: 'A deployed app has three wrong settings in `app.ini`: `debug =
  true` (must be false), `workers = 1` (must be 8), and `log_level =
  verbose` (must be info). Produce a command plan that fixes all three.
  Fewer commands is better — there is a hard budget.'
validation: []
assets: []
metadata:
  canary: "orc-canary-c11cc864cc4f30a3"
  difficulty: easy
  fs:
    app.ini: "[server]\ndebug = true\nworkers = 1\nlog_level = verbose\nport = 8080\n"
  commands:
    - run: "echo \"[server]\\ndebug = false\\nworkers = 8\\nlog_level = info\\nport = 8080\" > app.ini"
  expect:
    files:
      app.ini:
        equals: "[server]\ndebug = false\nworkers = 8\nlog_level = info\nport = 8080\n"
    max_commands: 2
